# DavMail settings — see https://davmail.sourceforge.net/serversetup.html
#
# Exchange/Office 365 connection mode:
#   O365Modern    — Office 365 modern authentication (OAuth2); recommended
#   O365Manual    — Office 365 with interactive dialog; use for first-run token
#   O365          — Office 365 EWS mode (legacy)
#   EWS           — Exchange 2007 and later (on-premise)
#   WebDav        — Exchange 2007 and earlier WebDAV mode
#   Auto          — WebDAV with EWS failover
davmail.mode=O365Modern

# Base Exchange OWA or EWS URL.
# For Office 365 / Exchange Online this is almost always:
davmail.url=https://outlook.office365.com/EWS/Exchange.asmx

# Run as a headless server daemon (no GUI).
davmail.server=true

# Bind to localhost only — change to your LAN IP if other hosts need access.
davmail.allowRemote=false
davmail.bindAddress=127.0.0.1

# Service ports (all on non-privileged ports so no root needed).
davmail.smtpPort=1025
davmail.imapPort=1143
davmail.popPort=1110
davmail.caldavPort=1080
davmail.ldapPort=1389

# Log file.
davmail.logFilePath=/var/log/davmail.log

# Logging levels (SLF4J/Logback in DavMail 6.x).
# Valid levels: ERROR, WARN, INFO, DEBUG
log.default=WARN
log.davmail=INFO
log.httpclient.wire=WARN
log.org.apache.commons.httpclient=WARN

# Mail retention settings (days).
davmail.keepDelay=30
davmail.sentKeepDelay=90
davmail.caldavPastDelay=90

# Miscellaneous.
davmail.disableUpdateCheck=true
davmail.showStartupBanner=false
davmail.imapAutoExpunge=true
davmail.caldavEditNotifications=false

# Proxy settings (leave blank if not needed).
davmail.enableProxy=false
davmail.useSystemProxies=false
davmail.proxyHost=
davmail.proxyPort=
davmail.proxyUser=
davmail.proxyPassword=

# SSL/TLS — only needed if you want encrypted local connections.
# For localhost-only use these can all stay empty/false.
davmail.ssl.nosecuresmtp=false
davmail.ssl.nosecureimap=false
davmail.ssl.nosecurepop=false
davmail.ssl.nosecurecaldav=false
davmail.ssl.nosecureldap=false
davmail.ssl.keystoreFile=
davmail.ssl.keystorePass=
davmail.ssl.keystoreType=
davmail.ssl.keyPass=
davmail.ssl.clientKeystoreFile=
davmail.ssl.clientKeystorePass=
davmail.ssl.clientKeystoreType=
davmail.ssl.pkcs11Library=
davmail.ssl.pkcs11Config=

# Miscellaneous legacy/advanced settings.
davmail.server.certificate.hash=
davmail.defaultDomain=
davmail.caldavAlarmSound=
davmail.imapIdleDelay=

